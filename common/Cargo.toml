[package]
name = "common"
version = "1.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
toml = "0.8.19"
glib = "0.20.4"
chrono = "0.4.38"
colored = "3.0.0"
sysinfo = "0.35.1"
gstreamer = "0.23.6"
thiserror = "2.0.12"
rust-embed = "8.5.0"
lazy_static = "1.5.0"
serde_json = "1.0.132"
macro = { path = "../macro" }
serde = { version = "1.0.219", features = ["derive"] }
tokio = { version = "1.45.0", features = ["full", "tracing"] }
uuid = { version = "1.16.0", features = ["v4", "fast-rng", "macro-diagnostics", "serde"] }
